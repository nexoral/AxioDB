name: Push to Registry

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Docker/**'
      - 'GUI/**'
      - 'Test/**'
      - 'Scripts/**'
      - 'cli/**'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_test: ${{ steps.filter.outputs.test_scripts == 'true' || steps.filter.outputs.main == 'true' || steps.filter.outputs.docker == 'true' }}
      run_npm_github: ${{ steps.filter.outputs.main == 'true' }}
      # 'main' already covers source/** and GUI/** (see filters below), so this fires the
      # Docker publish whenever source, GUI, or Docker/** itself changes - not just Docker/**.
      run_docker: ${{ steps.filter.outputs.docker == 'true' || steps.filter.outputs.main == 'true' }}
      run_cli_release: ${{ steps.filter.outputs.cli == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            test_scripts:
              - 'Test/**'
              - 'Scripts/**'
            main:
              - 'GUI/**'
              - 'source/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
            docker:
              - 'Docker/**'
            cli:
              - 'cli/**'

  auth_rbac_gate:
    name: "Gate 1 — Auth (RBAC) Test Suite"
    needs: [detect_changes]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20.x-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Auth (RBAC) tests
        run: npm test auth

  tcp_auth_rbac_gate:
    name: "Gate 2 — TCP Auth (AxioDBCloud RBAC) Test Suite"
    needs: [detect_changes]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20.x-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run TCP Auth (AxioDBCloud RBAC) tests
        run: npm test tcp-auth

  tcp_noauth_compat_gate:
    name: "Gate 3 — TCP No-Auth (Backward Compatibility) Test Suite"
    needs: [detect_changes]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20.x-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run TCP No-Auth (backward compatibility) tests
        run: npm test tcp-noauth

  test:
    needs: [detect_changes, auth_rbac_gate, tcp_auth_rbac_gate, tcp_noauth_compat_gate]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 21.x, 22.x, 23.x, 24.x, 25.x, 26.x]
      fail-fast: false  # Continue testing other versions even if one fails
    name: "Gate 4 — Full Matrix Test (Node ${{ matrix.node-version }})"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # Cache npm dependencies

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run CRUD tests
        run: npm test crud

      - name: Run Transaction tests
        run: npm test transaction

      - name: Run Read Optimization tests
        run: npm test read

      - name: Run Crash Recovery tests
        run: npm test crash-recovery

      - name: Run MCP Confirmation tests
        run: npm test mcp-confirm

  publish_to_npm:
    needs: [detect_changes, test]
    if: needs.detect_changes.outputs.run_npm_github == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC/Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1 or later
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run GUI Build
        run: cd GUI && npm install && npm run build && cd ..

      - name: Move GUI build files
        run: cd ./GUI && mv AxioControl/ ../lib/server/public && cd ..

      - name: Publish to NPM Registry
        run: npm publish --access public

  publish_to_github:
    needs: [detect_changes, test]
    if: needs.detect_changes.outputs.run_npm_github == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Build package
        run: npm run build
      - name: Run GUI Build
        run: cd GUI && npm install && npm run build && cd ..
      - name: Move GUI build files
        run: cd ./GUI && mv AxioControl/ ../lib/server/public && cd ..
      - name: Set GitHub Auth Token
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GIT_AUTH_TOKEN }}" >> ~/.npmrc
      - name: Change package name in package.json
        run: |
          sudo apt-get update && sudo apt-get install -y sed
          sed -i '2s/"axiodb"/"@${{ secrets.GIT_USER_NAME }}\/axiodb"/' package.json
      - name: Publish to GitHub Package Registry
        run: npm publish --registry=https://npm.pkg.github.com --scope=@${{ secrets.GIT_USER_NAME }} --access public

  publish_to_dockerhub:
    needs: [detect_changes, test]
    if: needs.detect_changes.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Run GUI Build
        run: cd GUI && npm install && npm run build && cd ..

      - name: Move GUI build files
        run: cd ./GUI && mv AxioControl/ ../lib/server/public && cd ..

      - name: Move the lib folder to Docker context
        run: mv lib/ Docker/

      - name: Copy package.json files
        run: cp package*.json Docker/

      - name: Copy Scripts folder to Docker context
        run: cp -r Scripts/ Docker/

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/axiodb:latest Docker/

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/axiodb:latest

  release_cli:
    name: "Release CLI Binary"
    needs: [detect_changes]
    if: needs.detect_changes.outputs.run_cli_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Read CLI version
        id: version
        run: |
          VERSION=$(cat cli/VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "CLI version: ${VERSION}"

      - name: Check if release should be created
        id: check
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          NEW_VERSION="${{ steps.version.outputs.version }}"

          # Check if this exact tag already exists
          if gh release view "$TAG" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${TAG} already exists, skipping"
            exit 0
          fi

          # Get the latest CLI release tag
          LATEST_TAG=$(gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' | grep '^cli-v' | head -1 || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous CLI release found, will create first release"
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#cli-v}"

          # Compare versions
          ver_gt() {
            local IFS=.
            local raw1 raw2 i ver1 ver2
            raw1="${1%%-*}"
            raw2="${2%%-*}"
            read -ra ver1 <<<"$raw1"
            read -ra ver2 <<<"$raw2"
            for ((i = ${#ver1[@]}; i < ${#ver2[@]}; i++)); do ver1[i]=0; done
            for ((i = ${#ver2[@]}; i < ${#ver1[@]}; i++)); do ver2[i]=0; done
            for ((i = 0; i < ${#ver1[@]}; i++)); do
              if ((10#${ver1[i]} > 10#${ver2[i]})); then return 0; fi
              if ((10#${ver1[i]} < 10#${ver2[i]})); then return 1; fi
            done
            return 1
          }

          if ver_gt "$NEW_VERSION" "$LATEST_VERSION"; then
            echo "Version ${NEW_VERSION} is higher than latest ${LATEST_VERSION}, will create release"
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${NEW_VERSION} is NOT higher than latest ${LATEST_VERSION}, skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Build binaries
        if: steps.check.outputs.exists == 'false'
        run: |
          cd cli
          mkdir -p bin
          VERSION=$(cat VERSION | tr -d '[:space:]')
          GOOS=linux  GOARCH=amd64 go build -o bin/axiodb_linux_amd64 .
          GOOS=linux  GOARCH=arm64 go build -o bin/axiodb_linux_arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o bin/axiodb_darwin_amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o bin/axiodb_darwin_arm64 .
          GOOS=windows GOARCH=amd64 go build -o bin/axiodb_windows_amd64.exe .

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          NOTES="AxioDB CLI v${{ steps.version.outputs.version }}\n\nCommit: ${COMMIT_HASH}\n\n${COMMIT_MSG}"

          gh release create "$TAG" \
            cli/bin/axiodb_linux_amd64 \
            cli/bin/axiodb_linux_arm64 \
            cli/bin/axiodb_darwin_amd64 \
            cli/bin/axiodb_darwin_arm64 \
            cli/bin/axiodb_windows_amd64.exe \
            --title "$TAG" \
            --notes "$(echo -e "$NOTES")"
        env:
          GH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Cleanup old CLI releases
        if: steps.check.outputs.exists == 'false'
        run: |
          release_tags=($(gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' | grep '^cli-v' || true))
          if [ ${#release_tags[@]} -gt 2 ]; then
            for ((i = 2; i < ${#release_tags[@]}; i++)); do
              old_tag=${release_tags[i]}
              echo "Deleting release ${old_tag}"
              gh release delete "$old_tag" --yes
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${old_tag}" || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
