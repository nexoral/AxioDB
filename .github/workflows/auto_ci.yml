  security_audit:
    name: "Security — CVE Audit Gate"
    needs: [detect_changes]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Run npm audit (JSON)
        id: audit
        run: |
          npm audit --omit=dev --json > audit-report.json || true

      - name: Annotate and Comment Audit Report
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit-report.json')) {
              console.log('No audit-report.json found');
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            } catch (e) {
              console.log('Failed to parse audit report JSON', e);
              return;
            }

            const metadata = report.metadata || {};
            const vulns = metadata.vulnerabilities || {};
            const critical = vulns.critical || 0;
            const high = vulns.high || 0;
            const moderate = vulns.moderate || 0;
            const low = vulns.low || 0;
            const total = vulns.total || 0;

            let md = `### 🔒 Security Audit Report (CVE Check)\n\n`;
            md += `<table width="100%">\n`;
            md += `  <thead>\n`;
            md += `    <tr>\n`;
            md += `      <th align="left" width="50%">Severity Level</th>\n`;
            md += `      <th align="center" width="50%">Vulnerabilities</th>\n`;
            md += `    </tr>\n`;
            md += `  </thead>\n`;
            md += `  <tbody>\n`;
            md += `    <tr><td>🔴 <b>Critical</b></td><td align="center">${critical}</td></tr>\n`;
            md += `    <tr><td>🟠 <b>High</b></td><td align="center">${high}</td></tr>\n`;
            md += `    <tr><td>🟡 <b>Moderate</b></td><td align="center">${moderate}</td></tr>\n`;
            md += `    <tr><td>🔵 <b>Low</b></td><td align="center">${low}</td></tr>\n`;
            md += `    <tr><td>📦 <b>Total Dependencies Scanned</b></td><td align="center">${metadata.dependencies?.total || 0}</td></tr>\n`;
            md += `  </tbody>\n`;
            md += `</table>\n\n`;

            if (total === 0) {
              md += `✅ **Zero known CVE vulnerabilities detected.** All dependencies passed clean!\n`;
            } else {
              md += `⚠️ **Found ${total} advisory issue(s).**\n\n`;
              md += `#### 📋 Vulnerability Details & CVE References\n\n`;
              md += `<table width="100%">\n`;
              md += `  <thead>\n`;
              md += `    <tr>\n`;
              md += `      <th align="left" width="20%">Package</th>\n`;
              md += `      <th align="center" width="15%">Severity</th>\n`;
              md += `      <th align="left" width="30%">CVE / Title</th>\n`;
              md += `      <th align="left" width="15%">Vulnerable Range</th>\n`;
              md += `      <th align="left" width="20%">Fix Status</th>\n`;
              md += `    </tr>\n`;
              md += `  </thead>\n`;
              md += `  <tbody>\n`;
              
              const details = report.vulnerabilities || {};
              for (const [pkg, info] of Object.entries(details)) {
                // Extract advisory titles / CVE URLs from the 'via' array
                let cveInfo = 'Advisory';
                if (Array.isArray(info.via)) {
                  const advisories = info.via
                    .filter(v => typeof v === 'object' && v !== null)
                    .map(v => v.url ? `<a href="${v.url}">${v.title || v.source || 'Advisory'}</a>` : (v.title || v.source));
                  if (advisories.length > 0) {
                    cveInfo = advisories.join(', ');
                  } else {
                    const parentPkgs = info.via.filter(v => typeof v === 'string');
                    if (parentPkgs.length > 0) {
                      cveInfo = `Via: ${parentPkgs.join(', ')}`;
                    }
                  }
                }

                let fixText = 'No direct fix';
                if (info.fixAvailable === true) {
                  fixText = '✅ <code>npm audit fix</code>';
                } else if (typeof info.fixAvailable === 'object' && info.fixAvailable !== null) {
                  fixText = `Upgrade to <code>${info.fixAvailable.name}@${info.fixAvailable.version}</code>`;
                }

                md += `    <tr>\n`;
                md += `      <td><code>${pkg}</code></td>\n`;
                md += `      <td align="center"><b>${info.severity.toUpperCase()}</b></td>\n`;
                md += `      <td>${cveInfo}</td>\n`;
                md += `      <td><code>${info.range || 'N/A'}</code></td>\n`;
                md += `      <td>${fixText}</td>\n`;
                md += `    </tr>\n`;
              }
              md += `  </tbody>\n`;
              md += `</table>\n\n`;
            }

            // Write to Workflow Step Summary & Annotations
            await core.summary.addRaw(md).write();

            if (critical > 0 || high > 0) {
              core.error(`Found ${critical} critical and ${high} high severity CVE vulnerabilities.`);
            }

            // Post or Update Pull Request Comment
            if (context.payload.pull_request) {
              const prNumber = context.payload.pull_request.number;
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                });

                const botComment = comments.find(c => c.body.includes('### 🔒 Security Audit Report (CVE Check)'));
                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: md,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: md,
                  });
                }
              } catch (err) {
                console.log('Unable to post PR comment (e.g. external fork token limit):', err.message);
              }
            }

      - name: Enforce High/Critical Failure
        run: |
          npm audit --omit=dev --audit-level=high