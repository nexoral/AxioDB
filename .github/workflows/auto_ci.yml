  test:
    needs: [detect_changes, auth_rbac_gate, tcp_auth_rbac_gate, tcp_noauth_compat_gate, http_api_gate, tcp_transaction_gate, tcp_tls_gate, mcp_functional_gate]
    if: needs.detect_changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    name: "Gate 8 — Benchmark Suite"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
