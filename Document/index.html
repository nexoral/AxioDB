  <!-- Schema.org: FAQPage (highest GEO signal) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AxioDB?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AxioDB is an embedded NoSQL database for Node.js with MongoDB-style queries. It is a pure JavaScript alternative to SQLite with zero native dependencies, no node-gyp compilation, and no platform-specific binaries. Install with 'npm install axiodb' and you have a database — no mongod process, no server setup. Perfect for Electron apps, CLI tools, and local-first applications."
          }
        },
        {
          "@type": "Question",
          "name": "Is AxioDB a replacement for MongoDB?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AxioDB is embedded — it runs inside your app with no server. MongoDB is a client-server database for multi-user production systems. Use AxioDB for desktop apps, CLI tools, and local-first applications with 10K–500K documents. Use MongoDB when you need a shared, networked, multi-user database."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB work with Electron?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — Electron is the primary use case AxioDB was built for. Zero native dependencies means no electron-rebuild, no platform-specific .node files, no node-gyp compilation. Just npm install axiodb and it works on Windows, Mac, and Linux without any rebuild step."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between AxioDB and better-sqlite3?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "better-sqlite3 uses C native bindings and requires compilation via node-gyp. AxioDB is pure JavaScript — it installs in any Node.js environment without compilation or platform-specific builds. AxioDB also uses NoSQL/JSON document queries instead of SQL strings, includes built-in caching and Worker Threads, and works out of the box in Electron without electron-rebuild."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between AxioDB and lowdb?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "lowdb stores everything in a single JSON file and becomes slow above 1,000–5,000 records due to full-file reads on every operation. AxioDB uses file-per-document tree storage with InMemoryCache, Worker Threads, and auto-indexing — optimized for 10,000–500,000 documents with O(1) lookups by ID and fast filtered queries."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between AxioDB and nedb?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NeDB is abandoned (no active maintenance since 2016) and keeps the entire database in memory. AxioDB is actively maintained, uses file-based storage, supports TypeScript, ACID transactions with savepoints and WAL, Worker Threads, custom field indexing, and AxioDBCloud remote access."
          }
        },
        {
          "@type": "Question",
          "name": "How many documents can AxioDB handle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AxioDB is optimized for 10,000–500,000 documents per collection. For 1M+ documents, migrate to PostgreSQL or MongoDB. AxioDB's InMemoryCache and Worker Threads keep performance fast within this range — documentId lookups take ~1ms and indexed queries take ~2ms on 10,000 documents."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB support TypeScript?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Full TypeScript type definitions are included out of the box with the axiodb npm package. No @types/axiodb needed."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB work in the browser?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AxioDB requires Node.js (v20+) and uses the filesystem for storage. It is a server-side and desktop embedded database. It does not run in browsers."
          }
        },
        {
          "@type": "Question",
          "name": "What is AxioDBCloud?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AxioDBCloud is AxioDB's own TCP remote-access layer on port 27019 — a protocol and client, not a hosted service. You run the server yourself with new AxioDB({ TCP: true }) or the Docker image, then connect from other processes using the exact same API as embedded AxioDB, with zero code changes. There is no account to create and Nexoral hosts no database for you. Limits: 1,000 total concurrent connections, 100 per IP. Optional shared-RBAC authentication (TCPAuth) and optional TLS."
          }
        },
        {
          "@type": "Question",
          "name": "How do I replace SQLite with AxioDB in a Node.js project?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Install with 'npm install axiodb' and map concepts directly: a SQLite table becomes a collection, a row becomes a JSON document, INTEGER PRIMARY KEY becomes the auto-generated documentId, CREATE INDEX becomes collection.newIndex('field'), and BEGIN/COMMIT/ROLLBACK become collection.beginTransaction()/.commit()/.rollback(). SQL strings become JavaScript objects: SELECT * FROM users WHERE age > 25 becomes users.query({ age: { $gt: 25 } }).exec(). There are no schemas and no migrations. What you give up: JOINs, foreign keys, SQL itself, ORMs like Prisma and Drizzle, and scale beyond roughly 500,000 documents per collection."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB need node-gyp, electron-rebuild, or a build step?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AxioDB is pure JavaScript with zero native dependencies — there is no C code, no .node binary, no node-gyp compilation, and no electron-rebuild step. Nothing has to match your OS, CPU architecture, or Node/Electron ABI version, so NODE_MODULE_VERSION mismatch errors are impossible. 'npm install axiodb' is the entire installation on every platform and every Node.js version 20 or newer."
          }
        },
        {
          "@type": "Question",
          "name": "How do I use AxioDB in an Electron app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Create the AxioDB instance in Electron's main process only, storing data in the per-user data directory: new AxioDB({ RootName: 'AppData', CustomPath: app.getPath('userData'), GUI: false }). Never write inside the app bundle or app.asar — asar is read-only and app contents are replaced on update. Expose database operations to the renderer through ipcMain.handle plus contextBridge rather than enabling nodeIntegration. No electron-rebuild step and no packaging configuration for native modules is required."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB have an MCP server for AI agents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — 43 MCP tools covering databases, collections, documents, aggregation, indexes, dashboard stats, user/role management, and transactions. Important: the MCP server ships only in the Docker image theankansaha/axiodb, not in the npm package. Enable it with AXIODB_MCP=true and connect over Streamable HTTP at http://localhost:27020/mcp. Every tool except axiodb_login requires a sessionId from logging in, and destructive tools ask the human for confirmation through the MCP client first."
          }
        },
        {
          "@type": "Question",
          "name": "What ports does AxioDB use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Port 27018 is the web Dashboard and its REST HTTP API, enabled with GUI: true. Port 27019 is the AxioDBCloud TCP server, enabled with TCP: true — it is a custom TCP protocol, not HTTP. Port 27020 is the MCP server, available only in the Docker image with AXIODB_MCP=true. Ports 27018 and 27019 are not configurable in code; remap them at the Docker layer. Only the MCP port can be changed, via AXIODB_MCP_PORT. By default the embedded library opens no ports at all."
          }
        },
        {
          "@type": "Question",
          "name": "Does AxioDB support MongoDB update operators like $inc and $set?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AxioDB updates are a flat shallow merge of your data object onto the existing document. Writing .UpdateOne({ $inc: { balance: -100 } }) does not increment anything — it literally stores a field named '$inc'. To change a numeric value, read the document, compute the new value in JavaScript, and write it back. Query operators are a separate thing and are fully supported: $gt, $gte, $lt, $lte, $eq, $ne, $in, $nin, $exists, $regex, $not, $type, $size, $all, $elemMatch, $or, $and, and $nor."
          }
        },
        {
          "@type": "Question",
          "name": "What are AxioDB's limitations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AxioDB targets 10,000 to 500,000 documents per collection on a single node. It has no JOINs, no foreign keys, no SQL, no replication, no sharding, and no clustering. Transactions are scoped to one collection — there are no cross-collection transactions. Only one AxioDB instance may exist per process. Aggregation supports only $sum and $avg accumulators, and its $match stage accepts fewer operators than query() does. Queries that are not an exact match on an indexed field fall back to a full collection scan. It does not run in browsers."
          }
        }
      ]
    }
